version: 2.1

defaults: &defaults
  working_directory: ~/postcss-themed
  docker:
    - image: circleci/node:20-browsers
  environment:
    TZ: '/usr/share/zoneinfo/America/Los_Angeles'

aliases:
  # # Circle related commands
  # - &restore-cache
  #   keys:
  #     # Find a cache corresponding to this specific package.json checksum
  #     # when this file is changed, this key will fail
  #     - auto-{{ checksum "yarn.lock" }}-{{ checksum ".circleci/config.yml" }}
  #     - auto-{{ checksum "yarn.lock" }}
  #     # Find the most recent cache used from any branch
  #     - auto-
  # - &save-cache
  #   key: auto-{{ checksum "yarn.lock" }}-{{ checksum ".circleci/config.yml" }}
  #   paths:
  #     - ~/.cache/yarn
  #     - node_modules
  # Yarn commands
  - &pnpm
    name: Install Dependencies
    command: pnpm install
  - &lint
    name: Lint
    command: pnpm lint
  - &test
    name: Test
    command: pnpm test
  - &build
    name: Build
    command: pnpm build

jobs:
  install:
    <<: *defaults
    steps:
      - checkout
      # - restore_cache: *restore-cache
      - run: *pnpm
      # - save_cache: *save-cache
      - persist_to_workspace:
          root: .
          paths:
            - .

  build:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/postcss-themed
      - run: *build
      - persist_to_workspace:
          root: .
          paths:
            - .

  lint:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/postcss-themed
      - run: *lint

  test:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/postcss-themed
      - run: *test
      - run:
          name: Send CodeCov Results
          command: bash <(curl -s https://codecov.io/bash) -t $CODECOV_KEY

  release:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/postcss-themed
      - run: mkdir ~/.ssh/ && echo -e "Host github.com\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
      - run:
          name: Release
          command: pnpm run release

workflows:
  version: 2
  build_and_test:
    jobs:
      - install

      - build:
          requires:
            - install

      - lint:
          requires:
            - build

      - test:
          requires:
            - build

      - release:
          requires:
            - test
            - lint
